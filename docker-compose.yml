#-------------------------------------------------------------------------------
# sagetv-mine — Docker Compose (shared-file-bind profile, supported alternate)
#
# This profile directly bind-mounts Wiz.bin and Sage.properties. Keep it for
# implementations that intentionally rely on direct file binds.
#
# For fresh install validation and drift cleanup, prefer the state-managed
# profile in sagetv-deploy (stage-in/mirror-out via STATE_DIR).
#
# IMPORTANT: Use identity mounts (same path host:container) for media volumes
# so that paths stored in Wiz.bin resolve correctly inside the container.
#
# Build:   docker compose build
# Run:     docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
#-------------------------------------------------------------------------------
services:
  sagetv-mine:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagetv-mine:current
    container_name: sagetv-mine
    restart: unless-stopped
    network_mode: host

    volumes:
      # ── Shared configuration & database (READ/WRITE) ──
      - /opt/sagetv/server/Wiz.bin:/opt/sagetv/server/Wiz.bin
      - /opt/sagetv/server/Sage.properties:/opt/sagetv/server/Sage.properties

      # ── Shared recordings / media libraries (identity mounts) ──
      # Add your recording drives here. Use identity mounts so Wiz.bin paths match.
      # Example:
      # - /media/recordings/drive1:/media/recordings/drive1
      # - /media/recordings/drive2:/media/recordings/drive2
      # If a drive was renamed, alias the old path:
      # - /media/recordings/drive1:/media/recordings/old-drive-name

      # ── Import directories ──
      # - /var/media/tv:/var/media/tv
      # - /var/media/videos:/var/media/videos
      # - /var/media/pictures:/var/media/pictures
      # - /var/media/music:/var/media/music

      # ── sagetv-mine isolated runtime state ──
      - /opt/sagetv/docker/mine/SageTVPlugins:/opt/sagetv/server/SageTVPlugins
      - /opt/sagetv/docker/mine/jetty:/opt/sagetv/server/jetty
      - /opt/sagetv/docker/mine/logs:/opt/sagetv/server/logs
