###############################################################################
# sagetv-mine — Docker Compose (shared-data model)
#
# Shared across all SageTV instances:  Wiz.bin, Sage.properties, recordings
# Isolated to this container:          JARs, plugins, jetty, logs, native libs
#
# Build:   docker compose build
# Run:     docker compose up -d
# Logs:    docker compose logs -f
# Stop:    docker compose down
###############################################################################
services:
  sagetv-mine:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagetv-mine:current
    container_name: sagetv-mine
    restart: unless-stopped
    network_mode: host

    volumes:
      # ── Shared configuration & database (READ/WRITE) ──
      - /opt/sagetv/server/Wiz.bin:/opt/sagetv/server/Wiz.bin
      - /opt/sagetv/server/Sage.properties:/opt/sagetv/server/Sage.properties

      # ── Shared recordings / media libraries (READ/WRITE) ──
      - /media/sagetv/nextcloud/SageTV9:/var/media/nextcloud-sagetv9
      - /media/sagetv/SixTB/SageTV9Recordings:/var/media/sixtb-sagetv9
      - /media/sagetv/SixTB1/SageV9Recordings:/var/media/sixtb1-sagetv9
      - /media/sagetv/SageTV64/SageV9Recordings:/var/media/sagetv64-sagetv9

      # ── sagetv-mine isolated runtime state ──
      - /opt/sagetv/docker/mine/SageTVPlugins:/opt/sagetv/server/SageTVPlugins
      - /opt/sagetv/docker/mine/jetty:/opt/sagetv/server/jetty
      - /opt/sagetv/docker/mine/logs:/opt/sagetv/server/logs
