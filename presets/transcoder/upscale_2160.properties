# Upscale 1080p -> 2160p HEVC ~18000k.
# Decode on GPU (cuda), Lanczos scale on CPU (the bundled ffmpeg has no
# scale_npp / scale_cuda -- not built with --enable-libnpp), encode on GPU
# (hevc_nvenc). 4K CPU lanczos is heavy; expect ~real-time at best.
# Rebuild ffmpeg with libnpp to swap in scale_npp for true GPU scaling.
name=UPSCALE_2160
displayName=TV \u2013 Enhanced 4K
container=mp4
global=-fflags +discardcorrupt -err_detect ignore_err -hwaccel cuda
args=-map 0:v:0 -map 0:a:0? -vf scale=3840:2160:flags=lanczos -c:v %V265% -preset p6 -rc:v vbr -cq:v 22 -b:v 18000k -maxrate 24000k -bufsize 48000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart