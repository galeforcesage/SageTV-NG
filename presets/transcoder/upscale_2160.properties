# Upscale 1080p -> 2160p HEVC ~18000k.
# Full-GPU pipeline: NVDEC decode -> scale_npp (Lanczos) -> NVENC encode.
# No PCIe round-trip. Requires ffmpeg built with --enable-libnpp.
# Software fallback (args_sw) uses CPU scale for non-GPU hosts.
name=UPSCALE_2160
displayName=TV \u2013 Enhanced 4K
container=mp4
global_nv=-fflags +discardcorrupt -err_detect ignore_err -hwaccel cuda -hwaccel_output_format cuda
args_nv=-map 0:v:0 -map 0:a:0? -vf scale_npp=3840:2160:interp_algo=lanczos -c:v %V265% -preset p6 -rc:v vbr -cq:v 22 -b:v 18000k -maxrate 24000k -bufsize 48000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart
global_sw=-fflags +discardcorrupt -err_detect ignore_err
args_sw=-map 0:v:0 -map 0:a:0? -vf scale=3840:2160:flags=lanczos -c:v libx265 -preset slow -crf 22 -b:v 18000k -maxrate 24000k -bufsize 48000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart