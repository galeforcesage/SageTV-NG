# Upscale 1080p → 1440p HEVC ~10000k
# GPU lanczos upscaler; reasonable quality for 1440p displays without AI SR.
name=UPSCALE_1440_FROM_1080
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=2560:1440:interp_algo=lanczos -c:v %V265% -preset p6 -rc:v vbr -cq:v 22 -b:v 10000k -maxrate 14000k -bufsize 28000k -profile:v main -tag:v hvc1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
