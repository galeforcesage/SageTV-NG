# TV 1080p (compatibility) — 1920x1080 H.264 high@4.0 ~8000k
# Maximum-compatibility target for smart TVs / set-top boxes; ~3.6GB/h.
# Uses level 4.0 and high profile to play on essentially anything modern.
name=TV_1080_COMPAT
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=1920:1080:interp_algo=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 20 -b:v 8000k -maxrate 12000k -bufsize 24000k -profile:v high -level 4.0 -c:a aac -b:a 256k -ac 2 -movflags +faststart
