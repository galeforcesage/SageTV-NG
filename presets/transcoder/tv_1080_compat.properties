# TV 1080p (compatibility) -- 1920x1080 H.264 high@4.0 ~8000k. Max smart-TV compat.
name=TV_1080_COMPAT
displayName=TV \u2013 HD Compatible
container=mp4
global_nv=-hwaccel cuda
args_nv=-vf scale=1920:1080:flags=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 20 -b:v 8000k -maxrate 12000k -bufsize 24000k -profile:v high -level 4.0 -c:a aac -b:a 256k -ac 2 -movflags +faststart
args_sw=-vf scale=1920:1080:flags=lanczos -c:v libx264 -preset medium -crf 20 -b:v 8000k -maxrate 12000k -bufsize 24000k -profile:v high -level 4.0 -c:a aac -b:a 256k -ac 2 -movflags +faststart