# Upscale 1080p -> 1440p HEVC ~10000k.
# Decode on GPU (cuda), Lanczos scale on CPU (the bundled ffmpeg has no
# scale_npp / scale_cuda -- not built with --enable-libnpp), encode on GPU
# (hevc_nvenc). Slower than full-GPU but works with the shipped binary.
# Rebuild ffmpeg with libnpp to swap in scale_npp later.
name=UPSCALE_1440
displayName=TV \u2013 Enhanced HD (1440p)
container=mp4
global=-fflags +discardcorrupt -err_detect ignore_err -hwaccel cuda
args=-map 0:v:0 -map 0:a:0? -vf scale=2560:1440:flags=lanczos -c:v %V265% -preset p6 -rc:v vbr -cq:v 22 -b:v 10000k -maxrate 14000k -bufsize 28000k -profile:v main -tag:v hvc1 -c:a aac -b:a 192k -ac 2 -movflags +faststart