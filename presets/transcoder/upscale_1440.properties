# Upscale 1080p -> 1440p HEVC ~10000k.
# Full-GPU pipeline: NVDEC decode -> scale_npp (Lanczos) -> NVENC encode.
# No PCIe round-trip. Requires ffmpeg built with --enable-libnpp.
# Software fallback (args_sw) uses CPU scale for non-GPU hosts.
name=UPSCALE_1440
displayName=TV \u2013 Enhanced HD (1440p)
container=mp4
global_nv=-fflags +discardcorrupt -err_detect ignore_err -hwaccel cuda -hwaccel_output_format cuda
args_nv=-map 0:v:0 -map 0:a:0? -vf scale_npp=2560:1440:interp_algo=lanczos -c:v %V265% -preset p6 -rc:v vbr -cq:v 22 -b:v 10000k -maxrate 14000k -bufsize 28000k -profile:v main -tag:v hvc1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
global_sw=-fflags +discardcorrupt -err_detect ignore_err
args_sw=-map 0:v:0 -map 0:a:0? -vf scale=2560:1440:flags=lanczos -c:v libx265 -preset slow -crf 22 -b:v 10000k -maxrate 14000k -bufsize 28000k -profile:v main -tag:v hvc1 -c:a aac -b:a 192k -ac 2 -movflags +faststart