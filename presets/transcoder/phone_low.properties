# Phone (Low) — 854x480 H.264 ~1500k
# Smallest reasonable target for older / slow phones; ~700MB/h.
name=PHONE_LOW
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=854:480:interp_algo=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 28 -b:v 1500k -maxrate 2000k -bufsize 4000k -profile:v main -level 3.1 -c:a aac -b:a 96k -ac 2 -movflags +faststart
