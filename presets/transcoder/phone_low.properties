# Phone (Low) -- 854x480 H.264 ~1500k. Smallest reasonable target; ~700MB/h.
name=PHONE_LOW
displayName=Mobile \u2013 Data Saver
container=mp4
global=-hwaccel cuda
args=-vf scale=854:480:flags=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 28 -b:v 1500k -maxrate 2000k -bufsize 4000k -profile:v main -level 3.1 -c:a aac -b:a 96k -ac 2 -movflags +faststart