# Phone (Low) -- 854x480 H.264 ~1500k. Smallest reasonable target; ~700MB/h.
# Frame rate is capped at 30fps via -fpsmax: high-fps sources (59.94/60) are
# decimated to ~29.97 to save bandwidth on small screens, while lower-rate
# sources (24/25/30) pass through untouched (fpsmax only reduces, never
# duplicates). This is source-fps-aware with no runtime inspection needed.
name=PHONE_LOW
displayName=Mobile \u2013 Data Saver
container=mp4
global_nv=-hwaccel cuda -hwaccel_output_format cuda
args_nv=-vf scale_npp=854:480:interp_algo=lanczos -fpsmax 30000/1001 -c:v %V264% -preset p5 -rc:v vbr -cq:v 28 -b:v 1500k -maxrate 2000k -bufsize 4000k -profile:v main -level 3.1 -c:a aac -b:a 96k -ac 2 -movflags +faststart
args_sw=-vf scale=854:480:flags=lanczos -fpsmax 30000/1001 -c:v libx264 -preset medium -crf 28 -b:v 1500k -maxrate 2000k -bufsize 4000k -profile:v main -level 3.1 -c:a aac -b:a 96k -ac 2 -movflags +faststart