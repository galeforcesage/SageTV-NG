# DVD-legacy MPEG-2 — 720x480 MPEG-2 ~6000k + AC-3
# Software-only path: NVENC has no MPEG-2 encoder, so no -hwaccel here.
# Output is a DVD-compatible MPEG-PS stream (.mpg / .vob).
name=DVD_LEGACY_MPEG2
container=mpeg
args=-vf scale=720:480:flags=lanczos -c:v mpeg2video -b:v 6000k -maxrate 9000k -bufsize 1835008 -profile:v 4 -level 4 -aspect 4:3 -c:a ac3 -b:a 384k -ac 2 -f dvd
