# Tablet 10" (1080p) — 1920x1080 H.264 ~5000k
# Wider audio/video balance than PHONE_HIGH_1080; ~2.3GB/h.
name=TABLET_10_1080
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=1920:1080:interp_algo=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 22 -b:v 5000k -maxrate 7000k -bufsize 14000k -profile:v high -level 4.1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
