# Tablet 12" (1440p HEVC) -- 2560x1440 HEVC ~8000k. Larger tablets / hi-DPI laptops.
name=TABLET_12_1440
displayName=Tablet \u2013 High Resolution (12"+)
container=mp4
global=-hwaccel cuda
args=-vf scale=2560:1440:flags=lanczos -c:v %V265% -preset p5 -rc:v vbr -cq:v 24 -b:v 8000k -maxrate 11000k -bufsize 22000k -profile:v main -tag:v hvc1 -c:a aac -b:a 192k -ac 2 -movflags +faststart