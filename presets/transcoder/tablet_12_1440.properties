# Tablet 12" (1440p HEVC) — 2560x1440 HEVC ~8000k
# Larger tablets / hi-DPI laptops; HEVC for better quality/bit ratio.
name=TABLET_12_1440
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=2560:1440:interp_algo=lanczos -c:v %V265% -preset p5 -rc:v vbr -cq:v 24 -b:v 8000k -maxrate 11000k -bufsize 22000k -profile:v main -tag:v hvc1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
