# Phone (High 1080p) -- 1920x1080 H.264 ~6000k. Flagship phones; ~2.7GB/h.
# Frame rate is capped at 30fps via -fpsmax: high-fps sources (59.94/60) are
# decimated to ~29.97 to save bandwidth on small screens, while lower-rate
# sources (24/25/30) pass through untouched (fpsmax only reduces, never
# duplicates). The cap also keeps 1080p output within H.264 Level 4.1, which
# tops out at 1080p30 -- a 60fps source would otherwise exceed the level.
name=PHONE_HIGH_1080
displayName=Mobile \u2013 High Quality
container=mp4
global_nv=-hwaccel cuda -hwaccel_output_format cuda
args_nv=-vf scale_npp=1920:1080:interp_algo=lanczos -fpsmax 30000/1001 -c:v %V264% -preset p5 -rc:v vbr -cq:v 21 -b:v 6000k -maxrate 8000k -bufsize 16000k -profile:v high -level 4.1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
args_sw=-vf scale=1920:1080:flags=lanczos -fpsmax 30000/1001 -c:v libx264 -preset medium -crf 21 -b:v 6000k -maxrate 8000k -bufsize 16000k -profile:v high -level 4.1 -c:a aac -b:a 192k -ac 2 -movflags +faststart