# Phone (High 1080p) -- 1920x1080 H.264 ~6000k. Flagship phones; ~2.7GB/h.
name=PHONE_HIGH_1080
displayName=Mobile \u2013 High Quality
container=mp4
global_nv=-hwaccel cuda
args_nv=-vf scale=1920:1080:flags=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 21 -b:v 6000k -maxrate 8000k -bufsize 16000k -profile:v high -level 4.1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
args_sw=-vf scale=1920:1080:flags=lanczos -c:v libx264 -preset medium -crf 21 -b:v 6000k -maxrate 8000k -bufsize 16000k -profile:v high -level 4.1 -c:a aac -b:a 192k -ac 2 -movflags +faststart