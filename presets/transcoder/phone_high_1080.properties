# Phone (High 1080p) — 1920x1080 H.264 ~6000k
# Flagship phones / small tablets; ~2.7GB/h.
name=PHONE_HIGH_1080
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=1920:1080:interp_algo=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 21 -b:v 6000k -maxrate 8000k -bufsize 16000k -profile:v high -level 4.1 -c:a aac -b:a 192k -ac 2 -movflags +faststart
