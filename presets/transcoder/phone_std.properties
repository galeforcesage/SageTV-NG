# Phone (Standard) -- 1280x720 H.264 ~3500k. Typical phone target; ~1.6GB/h.
name=PHONE_STD
displayName=Mobile \u2013 Standard
container=mp4
global_nv=-hwaccel cuda -hwaccel_output_format cuda
args_nv=-vf scale_npp=1280:720:interp_algo=lanczos -c:v %V264% -preset p5 -rc:v vbr -cq:v 23 -b:v 3500k -maxrate 4500k -bufsize 9000k -profile:v high -level 4.0 -c:a aac -b:a 160k -ac 2 -movflags +faststart
args_sw=-vf scale=1280:720:flags=lanczos -c:v libx264 -preset medium -crf 23 -b:v 3500k -maxrate 4500k -bufsize 9000k -profile:v high -level 4.0 -c:a aac -b:a 160k -ac 2 -movflags +faststart