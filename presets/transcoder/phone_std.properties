# Phone (Standard) -- 1280x720 H.264 ~3500k. Typical phone target; ~1.6GB/h.
# Frame rate is capped at 30fps via -fpsmax: high-fps sources (59.94/60) are
# decimated to ~29.97 to save bandwidth on small screens, while lower-rate
# sources (24/25/30) pass through untouched (fpsmax only reduces, never
# duplicates). This is source-fps-aware with no runtime inspection needed.
name=PHONE_STD
displayName=Mobile \u2013 Standard
container=mp4
global_nv=-hwaccel cuda -hwaccel_output_format cuda
args_nv=-vf scale_npp=1280:720:interp_algo=lanczos -fpsmax 30000/1001 -c:v %V264% -preset p5 -rc:v vbr -cq:v 23 -b:v 3500k -maxrate 4500k -bufsize 9000k -profile:v high -level 4.0 -c:a aac -b:a 160k -ac 2 -movflags +faststart
args_sw=-vf scale=1280:720:flags=lanczos -fpsmax 30000/1001 -c:v libx264 -preset medium -crf 23 -b:v 3500k -maxrate 4500k -bufsize 9000k -profile:v high -level 4.0 -c:a aac -b:a 160k -ac 2 -movflags +faststart