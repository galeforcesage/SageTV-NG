# Upscale 1080p → 2160p HEVC ~18000k
# GPU lanczos upscaler for 4K TVs. Larger files (~8GB/h) — meant for
# keepers, not bulk processing. AI SR is a future enhancement.
name=UPSCALE_2160_FROM_1080
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=3840:2160:interp_algo=lanczos -c:v %V265% -preset p6 -rc:v vbr -cq:v 22 -b:v 18000k -maxrate 24000k -bufsize 48000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart
