# TV 4K HEVC — 3840x2160 HEVC ~16000k
# Modern 4K smart TVs. Source must be ≥1080p or this just wastes bits.
# hvc1 tag for Apple ecosystem compatibility.
name=TV_4K_HEVC
container=mp4
global=-hwaccel cuda -hwaccel_output_format cuda
args=-vf scale_npp=3840:2160:interp_algo=lanczos -c:v %V265% -preset p5 -rc:v vbr -cq:v 22 -b:v 16000k -maxrate 22000k -bufsize 44000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart
