# TV 4K HEVC -- 3840x2160 HEVC ~16000k. Source must be >=1080p to be worthwhile.
name=TV_4K_HEVC
displayName=TV \u2013 4K Ultra HD
container=mp4
global_nv=-hwaccel cuda
args_nv=-vf scale=3840:2160:flags=lanczos -c:v %V265% -preset p5 -rc:v vbr -cq:v 22 -b:v 16000k -maxrate 22000k -bufsize 44000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart
args_sw=-vf scale=3840:2160:flags=lanczos -c:v libx265 -preset medium -crf 22 -b:v 16000k -maxrate 22000k -bufsize 44000k -profile:v main -tag:v hvc1 -c:a aac -b:a 256k -ac 2 -movflags +faststart