# Archive (HEVC MKV) -- keep source resolution, HEVC cq18, MKV container.
# Long-term archival. No scaler so original resolution is preserved.
# Higher bitrate ceiling than the screen-class presets; AC-3 audio retained.
name=ARCHIVE_HEVC_MKV
displayName=Archive \u2013 High Quality (HEVC)
container=matroska
global_nv=-hwaccel cuda -hwaccel_output_format cuda
args_nv=-c:v %V265% -preset p6 -rc:v vbr -cq:v 18 -b:v 12000k -maxrate 20000k -bufsize 40000k -profile:v main10 -pix_fmt p010le -c:a copy
args_sw=-c:v libx265 -preset slow -crf 18 -b:v 12000k -maxrate 20000k -bufsize 40000k -profile:v main10 -pix_fmt p010le -c:a copy