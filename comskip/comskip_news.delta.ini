; ==================================================
; comskip_news.delta.ini
; Tuned starting delta: news / information / talk / weather
; Merge after base/source and before station/channel/show overrides.
; Values are SageTV-NG starting points, not official Comskip presets.
; IMPORTANT: set ticker_tape or ticker_tape_percentage in a measured
; station/channel override, not globally here; logo positions vary.
; ==================================================
; Exclude scene-change and cutscene signals; source changes are normal.
detect_method=123
; Reduce cutpoints from normal studio/interview pauses.
min_silence=20
; Permit short sponsor, promo, and local-news ad pods.
min_commercialbreak=20
; Keep long pods when individual advertisements are not separated.
max_commercial_size=300
; Protect short reports, interviews, weather, and analysis segments.
min_show_segment_length=60
; Smooth transient logo failures through full-screen packages.
logo_filter=4
; Remote clips and graphics can change AR; do not cut directly on it.
cut_on_ar_change=0
