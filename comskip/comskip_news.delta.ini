; ======================================
; comskip_news.delta.ini (ID=2)
; Aggressive bias for news & talk
; Applied as base(0) + news(2)
; ======================================

; Use every signal we have
detect_method=255

; News has short stories — lower segment threshold
min_show_segment_length=300
min_commercialbreak=45

; Logos & audio are strong signals here
punish_no_logo=0
verbose=8
