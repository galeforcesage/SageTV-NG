; ==================================================
; comskip_sports.delta.ini
; Tuned starting delta: live/event sports
; Merge after base/source and before station/channel/show overrides.
; Values are SageTV-NG starting points, not official Comskip presets.
; ==================================================
; 43 = black/uniform + logo + resolution + AR.
; Excludes scene change, CC, silence, and cutscene signals.
detect_method=43
; Reject short timeout/replay/bumper sequences as complete ad breaks.
min_commercialbreak=60
; Keep long sports ad pods when internal boundaries are weak.
max_commercial_size=300
; Protect short drives, possessions, replays, and analysis blocks.
min_show_segment_length=90
; Smooth transient logo failures around score/replay graphics.
logo_filter=4
; Do not generate direct cutpoints from sports AR/layout changes.
cut_on_ar_change=0
