; ==================================================
; comskip_base.ini (ID=0)
; Adaptive baseline for SageTV (US OTA / cable)
; ==================================================

; --- Detection: enable everything, validate later ---
detect_method=255
validate_silence=1
validate_uniform=1
validate_scenechange=1

; --- Logging ---
verbose=8

; --- Brightness / black-frame (AUTO) ---
max_brightness=60
test_brightness=40
max_avg_brightness=0
intelligent_brightness=1

; --- Uniform frame tolerance ---
non_uniformity=500

; --- Audio (AUTO bias) ---
max_volume=0
min_silence=12

; --- Commercial geometry (safe middle ground) ---
min_commercialbreak=45
max_commercialbreak=600
min_commercial_size=4
max_commercial_size=125
min_show_segment_length=222

; --- Logo handling (neutral) ---
logo_percentile=0.92
logo_threshold=0.75
punish_no_logo=0
use_existing_logo_file=0
delete_logo_file=1

; --- Outputs (SageTV-friendly) ---
output_edl=1
output_vdr=1

; --- Performance ---
thread_count=1
lowres=1
