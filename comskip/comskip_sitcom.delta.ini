; ==================================================
; comskip_sitcom.delta.ini
; Tuned starting delta: sitcom / short-form comedy
; Merge after base/source and before station/channel/show overrides.
; Values are SageTV-NG starting points, not official Comskip presets.
; ==================================================
; Exclude scene-change and cutscene signals; frequent edits are normal.
detect_method=123
; Slightly reduce silence sensitivity versus base=12.
min_silence=15
; Allow short, regularly timed sitcom commercial/promo pods.
min_commercialbreak=15
; Keep long pods when internal ad boundaries are not found.
max_commercial_size=300
; Protect short scenes, cold opens, and tag scenes (base=222).
min_show_segment_length=90
; Use reliable logo loss as commercial evidence when a logo is found.
punish_no_logo=1
; Smooth brief bad/missing logo matches.
logo_filter=4
