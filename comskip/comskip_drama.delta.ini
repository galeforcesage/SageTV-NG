; ==================================================
; comskip_drama.delta.ini
; Tuned starting delta: episodic drama / scripted TV
; Merge after base/source and before station/channel/show overrides.
; Values are SageTV-NG starting points, not official Comskip presets.
; ==================================================
; 123 = black/uniform + logo + resolution + CC + AR + silence.
; Excludes scene-change (4) and cutscene (128) signals.
detect_method=123
; Require a longer silent run than the base's 12 frames.
min_silence=20
; Recover short promo/ad pods that base=45 can discard.
min_commercialbreak=20
; Keep long pods when internal ad boundaries are not found.
max_commercial_size=300
; Score program blocks over two minutes toward show (base=222).
min_show_segment_length=120
; When a usable logo exists, logo absence becomes commercial evidence.
punish_no_logo=1
; Smooth brief bad/missing logo matches; sample config suggests 4.
logo_filter=4
