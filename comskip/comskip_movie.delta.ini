; ==================================================
; comskip_movie.delta.ini
; Tuned starting delta: ad-supported movies
; Merge after base/source and before station/channel/show overrides.
; Values are SageTV-NG starting points, not official Comskip presets.
; ==================================================
; Exclude scene-change and cutscene signals; cinematic edits/fades are normal.
detect_method=123
; Require longer silence before it can contribute a cutpoint.
min_silence=30
; Require a substantial pod so fades/title cards are not short breaks.
min_commercialbreak=30
; Ignore very short candidates that are likely cinematic transitions.
min_commercial_size=10
; Keep long movie ad pods when internal boundaries are weak.
max_commercial_size=300
; Long-form assumption: blocks over three minutes strongly favor show.
min_show_segment_length=180
; Use reliable logo loss as ad evidence when the broadcaster has a logo.
punish_no_logo=1
; Smooth brief bad/missing logo matches.
logo_filter=4
