; ==================================================
; channel_override.example.delta.ini
; COPY and rename for a measured station/network/channel override.
; All examples remain commented so this file changes nothing.
; Merge AFTER the content delta; exact channel overrides station/network.
; ==================================================
; Persistent bottom ticker: prefer percentage across mixed resolutions.
; Measure the ticker and confirm it does not cover the station logo.
; ticker_tape_percentage=8
;
; Or use an exact pixel count for a fixed-resolution channel:
; ticker_tape=120
;
; Restrict logo search to lower half only after confirming logo placement:
; logo_at_bottom=1
;
; Fixed station-specific thresholds must come from retained .log/.csv data:
; max_avg_brightness=25
; max_volume=500
;
; Station-specific commercial geometry, only after measuring several shows:
; min_commercialbreak=20
; max_commercial_size=300
