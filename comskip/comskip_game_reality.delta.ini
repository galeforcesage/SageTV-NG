; ==================================================
; comskip_game_reality.delta.ini
; Tuned starting delta: game shows / dating / reality / variety
; Merge after base/source and before station/channel/show overrides.
; Values are SageTV-NG starting points, not official Comskip presets.
; ==================================================
; Exclude scene-change and cutscene signals; rapid edits are normal.
detect_method=123
; Reduce cutpoints from pauses, reveals, and dramatic holds.
min_silence=15
; Permit normal short ad/promo pods without accepting tiny bumpers.
min_commercialbreak=20
; Keep long pods when internal ad boundaries are weak.
max_commercial_size=300
; Protect rounds, confessionals, recaps, reveals, and bumpers.
min_show_segment_length=90
; Smooth transient logo loss around contestant/prize graphics.
logo_filter=4
; Layout and inserted clips can change AR; avoid direct AR cutpoints.
cut_on_ar_change=0
